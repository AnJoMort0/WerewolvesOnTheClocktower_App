name: Windows LAN download

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lan:release
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-LAN-download
          path: .build/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Windows-LAN-download
          path: .build/release
      - name: Attach the ready-to-play download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" ".build/release/WerewolvesOnTheClocktower-LAN-Windows-x64.zip" ".build/release/WerewolvesOnTheClocktower-LAN-Windows-x64.zip.sha256" --repo "$env:GITHUB_REPOSITORY" --clobber
